name: Build

on:
  push:
    branches: [ main, develop, avalonia-11 ]
  pull_request:
    branches: [ main, develop, avalonia-11 ]

env:
  configuration: Release

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        submodules: 'recursive'

    - name: Install .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x

    - name: Build
      run: dotnet build --configuration ${{ env.configuration }}
      working-directory: src

    # Headless render of the Sandbox, the exit code is the number of failed checks
    - name: Audit
      run: dotnet run --project Citrus.Avalonia.Audit --configuration ${{ env.configuration }} --no-build -- artifacts/audit
      working-directory: src

    - name: Upload audit report and screenshots
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: audit
        path: src/artifacts/audit
        if-no-files-found: ignore
